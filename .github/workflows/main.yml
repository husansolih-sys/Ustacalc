
name: Build UstaCalc APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q UstaCalc_Android_Project.zip -d buildsrc

      - name: Build APK
        run: gradle -p buildsrc/UstaCalcAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: UstaCalc-APK
          path: buildsrc/UstaCalcAndroid/app/build/outputs/apk/debug/app-debug.apk
